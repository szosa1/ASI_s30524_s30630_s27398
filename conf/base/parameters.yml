# Sprint 2 — parametry pipeline'u.

dataset_id: online_shoppers

#Parametry do podziału train/test i random state
test_size: 0.2
random_state: 42

#Ficzery numeryczne
numeric_features:
  - Administrative
  - Administrative_Duration
  - Informational
  - Informational_Duration
  - ProductRelated
  - ProductRelated_Duration
  - BounceRates
  - ExitRates
  - SpecialDay

#Ficzery kategoryczne
categorical_features:
  - Month
  - OperatingSystems
  - Browser
  - Region
  - TrafficType
  - VisitorType
  - Weekend

# Sprint 3
wandb:
  project: ASI_s30524_s30630_s27398
  entity: wnukdominika-polish-japanese-academy-of-information-tec

model_packages_dir: data/06_models/packages

production_model: baseline_logreg

autogluon_enabled: true
autogluon_models_dir: data/06_models/autogluon

autogluon_configs:
  ag_medium:
    presets: medium_quality
    time_limit: 120
  ag_good:
    presets: good_quality
    time_limit: 300
